<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>GotaAssistent</title>
    <style>
      /* The Gota cat that slides up over any program: a speech bubble glued above the cat, growing upwards. Transparent window, only these shapes are visible. */
      :root {
        --surface: #171c38;
        --primary: #6f63f2;
        --text: #e8eaf6;
        --muted: #8f96c0;
        --hover: #232a52;
        --red: #e5484d;
      }
      html, body { margin: 0; background: transparent !important; color-scheme: normal; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; }
      #stage { position: fixed; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: flex-end; padding: 0 12px 0 0; }
      #bubble { position: relative; max-width: 360px; min-width: 120px; margin: 0 6px 12px 0; padding: 12px 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--primary);
        font-size: 15px; line-height: 1.4; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); cursor: pointer; word-wrap: break-word; }
      #bubble::after { content: ""; position: absolute; right: 38px; bottom: -8px; width: 14px; height: 14px; background: var(--surface); border-right: 1px solid var(--primary); border-bottom: 1px solid var(--primary);
        transform: rotate(45deg); border-bottom-right-radius: 3px; }
      #heard { display: none; margin-bottom: 6px; font-size: 12px; color: var(--muted); font-style: italic; }
      #answer.dim { color: var(--muted); }
      #row { display: flex; align-items: flex-end; }
      #buttons { display: flex; gap: 6px; margin: 0 6px 16px 0; }
      .round { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface); color: var(--text); font-size: 14px; cursor: pointer; border: 1px solid #2b3263; }
      .round:hover { background: var(--hover); }
      .round.red { background: var(--red); border-color: var(--red); }
      #cat { width: 150px; height: 150px; image-rendering: pixelated; object-fit: contain; cursor: pointer; }
      .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bubble"><div id="heard"></div><div id="answer"></div></div>
      <div id="row">
        <div id="buttons"><button class="round red" id="hangup" title="Desligar" aria-label="Desligar">✕</button></div>
        <img id="cat" alt="" draggable="false" />
      </div>
    </div>
    <script src="./animations.js"></script>
    <script src="./overlay.js"></script>
  </body>
</html>
